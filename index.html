body:after{content:"";position:fixed;inset:0;background:radial-gradient(circle at top,rgba(218,169,69,.16),transparent 42%);z-index:-1}
.wrap{width:min(920px,94%);margin:0 auto;padding:28px 0 50px}
header{text-align:center;padding:18px 0 28px}
.logo{width:105px;height:105px;object-fit:cover;border-radius:50%;border:2px solid #d9aa4a;box-shadow:0 0 30px rgba(217,170,74,.2)}
h1{margin:16px 0 6px;font-size:clamp(28px,6vw,46px);letter-spacing:2px}
.sub{color:#cfcfcf;margin:0}
.card{background:rgba(15,15,15,.88);border:1px solid rgba(217,170,74,.28);border-radius:24px;padding:24px;backdrop-filter:blur(8px);box-shadow:0 18px 60px rgba(0,0,0,.35)}
h2{margin-top:0;font-size:22px}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.service{position:relative;border:1px solid #333;background:#111;border-radius:18px;padding:20px;cursor:pointer;transition:.2s}
.service:hover{transform:translateY(-2px);border-color:#d9aa4a}
.service input{position:absolute;opacity:0}
.service:has(input:checked){border-color:#d9aa4a;box-shadow:0 0 0 2px rgba(217,170,74,.16)}
.service strong{display:block;font-size:18px}
.price{display:block;color:#e0b45b;font-size:25px;font-weight:800;margin-top:9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
label{display:block;color:#ddd;font-size:14px;margin-bottom:7px}
input[type=text],input[type=tel],input[type=date],select{width:100%;padding:14px 15px;border-radius:12px;border:1px solid #363636;background:#0c0c0c;color:#fff;font-size:16px;outline:none}
input:focus,select:focus{border-color:#d9aa4a}
.full{grid-column:1/-1}
button{width:100%;margin-top:20px;padding:16px;border:0;border-radius:14px;background:linear-gradient(135deg,#e2b65f,#b98224);color:#090909;font-size:17px;font-weight:900;cursor:pointer}
#resultado{display:none;margin-top:18px;padding:16px;border-radius:14px;background:#151515;border:1px solid #3c3c3c;line-height:1.6}
.small{font-size:13px;color:#aaa;text-align:center;margin-top:16px}
@media(max-width:650px){.services{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:18px}}
</style>
</head>

<h1>BARBEARIA VR</h1>
<p class="sub">Agende seu horário de forma rápida e moderna</p>
</header>

<section class="card">
<h2>Escolha seu serviço</h2>
<div class="services">
<label class="service"><input type="radio" name="servico" value="Corte" data-preco="10" checked><strong>✂️ Corte</strong><span class="price">R$ 10</span></label>
<label class="service"><input type="radio" name="servico" value="Barba" data-preco="5"><strong>🧔 Barba</strong><span class="price">R$ 5</span></label>
<label class="service"><input type="radio" name="servico" value="Barba + Corte" data-preco="15"><strong>🔥 Barba + Corte</strong><span class="price">R$ 15</span></label>
</div>

<div class="grid">
<div><label for="nome">Seu nome</label><input id="nome" type="text" placeholder="Digite seu nome"></div>
<div><label for="telefone">WhatsApp</label><input id="telefone" type="tel" placeholder="(00) 00000-0000"></div>
<div><label for="data">Data</label><input id="data" type="date"></div>
<div><label for="hora">Horário</label><select id="hora">
<option value="">Escolha um horário</option>
<option>08:00</option><option>08:30</option><option>09:00</option><option>09:30</option>
<option>10:00</option><option>10:30</option><option>11:00</option><option>11:30</option>
<option>13:00</option><option>13:30</option><option>14:00</option><option>14:30</option>
<option>15:00</option><option>15:30</option><option>16:00</option><option>16:30</option>
<option>17:00</option><option>17:30</option><option>18:00</option><option>18:30</option>
</select></div>
<div class="full"><label for="obs">Observação (opcional)</label><input id="obs" type="text" placeholder="Ex.: degradê, barba desenhada..."></div>
</div>

<button onclick="agendar()">CONFIRMAR AGENDAMENTO</button>
<div id="resultado"></div>
<p class="small">Após confirmar, confira os dados do seu horário antes de comparecer.</p>
</section>
</div>

<script>
const d=document.getElementById('data');
const hoje=new Date(); hoje.setMinutes(hoje.getMinutes()-hoje.getTimezoneOffset());
d.min=hoje.toISOString().split('T')[0];

function agendar(){
  const nome=document.getElementById('nome').value.trim();
  const tel=document.getElementById('telefone').value.trim();
  const data=document.getElementById('data').value;
  const hora=document.getElementById('hora').value;
  const obs=document.getElementById('obs').value.trim();
  const s=document.querySelector('input[name="servico"]:checked');

  if(!nome||!tel||!data||!hora){
    alert('Preencha nome, WhatsApp, data e horário.');
    return;
  }

  const dataBR=new Date(data+'T00:00:00').toLocaleDateString('pt-BR');
  const mensagem =
    'Olá! Quero agendar um horário na Barbearia VR.%0A%0A' +
    'Nome: '+encodeURIComponent(nome)+'%0A' +
    'Serviço: '+encodeURIComponent(s.value)+' — R$ '+s.dataset.preco+'%0A' +
    'Data: '+encodeURIComponent(dataBR)+'%0A' +
    'Horário: '+encodeURIComponent(hora)+'%0A' +
    'WhatsApp do cliente: '+encodeURIComponent(tel) +
    (obs ? '%0AObservação: '+encodeURIComponent(obs) : '');

  const numero='5588982361280';
  const url='https://wa.me/'+numero+'?text='+mensagem;

  const r=document.getElementById('resultado');
  r.style.display='block';
  r.innerHTML='<strong>Agendamento pronto!</strong><br>Você será levado ao WhatsApp para enviar os dados.'+
    '<br><br><a href="'+url+'" target="_blank" rel="noopener" style="display:inline-block;padding:13px 18px;border-radius:12px;background:#25D366;color:#061b0d;text-decoration:none;font-weight:900">ENVIAR PELO WHATSAPP</a>';
  r.scrollIntoView({behavior:'smooth',block:'center'});
}
</script>
